[pytest]
asyncio_mode = auto
markers =
    integration: requires real external infrastructure (PostgreSQL, Redis, Docker) not available in every environment -- see tests/test_postgres_integration.py
    postgres: requires a real PostgreSQL server reachable via TEST_DATABASE_URL -- self-skips with a clear message otherwise, never substitutes SQLite

# `pytest` alone (no -m filter) still collects and RUNS these files --
# they self-skip via pytest.mark.skipif when their required real
# infrastructure isn't reachable, rather than being silently excluded by
# default (which would make it too easy to forget they exist). Run just
# the fast local suite with: pytest -m "not integration and not postgres"
# Run only the infrastructure-backed tests (when available) with: pytest -m postgres
