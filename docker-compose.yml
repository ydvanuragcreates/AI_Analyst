# Production-oriented Docker setup: api, worker, postgres, redis.
#
# api and worker share ONE image (backend/Dockerfile) -- only the
# command differs. Healthchecks on postgres/redis gate api/worker startup
# via `depends_on: condition: service_healthy`, so neither starts against
# a database/broker that isn't accepting connections yet.
#
# Usage:
#   docker compose up --build
#   docker compose ps
#   curl http://localhost:8000/health/ready

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ai_data_analyst
      POSTGRES_PASSWORD: ai_data_analyst
      POSTGRES_DB: ai_data_analyst
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_data_analyst"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # NOTE on the shared `dataset_storage` volume: DuckDB is an embedded,
  # single-writer-process database (like SQLite) -- it does not support
  # concurrent read-write access to the same file from two separate OS
  # processes. Running `api` and `worker` as genuinely separate
  # containers, both able to open the DuckDB file, is a real, unresolved
  # limitation of this setup (not something this compose file papers
  # over) -- see the project write-up's "potential bottlenecks" section.
  # It's shipped this way because that's the honest shape of "API +
  # background worker," and DuckDB itself was an explicit, deliberate
  # choice earlier in this project (analytical query engine, not
  # something Phase 9 was asked to replace) -- a real production
  # deployment would need to pick one of: routing all DuckDB access
  # through a single process, DuckDB's read-only multi-reader mode for
  # whichever side doesn't write, or migrating off embedded DuckDB.
  api:
    build:
      context: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ai_data_analyst:ai_data_analyst@postgres:5432/ai_data_analyst
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - dataset_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ai_data_analyst:ai_data_analyst@postgres:5432/ai_data_analyst
      REDIS_URL: redis://redis:6379/0
    volumes:
      - dataset_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  dataset_storage:
